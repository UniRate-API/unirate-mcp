name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKER_HUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build the image list dynamically so Docker Hub is only included when
      # the DOCKER_HUB_USERNAME Actions variable is set on the repo.
      - name: Compute image list
        id: imgs
        run: |
          IMGS="ghcr.io/unirate-api/unirate-mcp"
          if [ -n "$DH_USER" ]; then
            IMGS="$IMGS"$'\n'"docker.io/$DH_USER/unirate-mcp"
          fi
          printf 'list<<EOF\n%s\nEOF\n' "$IMGS" >> "$GITHUB_OUTPUT"
        env:
          DH_USER: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=unirate-mcp
            org.opencontainers.image.description=Model Context Protocol server for the UniRate API — currency exchange rates and conversion for AI assistants
            org.opencontainers.image.url=https://github.com/UniRate-API/unirate-mcp
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
